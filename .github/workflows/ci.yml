name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: MCP schema contract tests
        run: go test -v ./internal/mcp/... -run 'Schema|FilePush'
      - name: Run all tests
        run: go test -v ./...
