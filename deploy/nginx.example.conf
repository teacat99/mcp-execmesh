# Nginx Reverse Proxy for Remote Executor MCP Gateway
# Supports Streamable HTTP & SSE streaming connections

# http context (not inside server):
#   map $uri $mcp_safe_uri {
#       ~^/mcp/cap_v1_  /mcp/[CAPABILITY];
#       ~^/files/       /files/[TICKET];
#       default         $request_uri;
#   }
#   log_format mcp_redacted '$remote_addr - $request_method $mcp_safe_uri $status';

upstream remote_mcp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/certs/mcp.example.com.crt;
    ssl_certificate_key /etc/ssl/private/mcp.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/mcp.access.log mcp_redacted;

    location /mcp {
        proxy_pass http://remote_mcp_backend;
        proxy_http_version 1.1;

        # Disable buffering for Streamable HTTP / SSE chunked responses
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /files/ {
        proxy_pass http://remote_mcp_backend;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /healthz {
        proxy_pass http://remote_mcp_backend/healthz;
        proxy_http_version 1.1;
    }

    location /readyz {
        proxy_pass http://remote_mcp_backend/readyz;
        proxy_http_version 1.1;
    }
}
