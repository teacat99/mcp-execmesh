services:
  remote-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-execmesh:latest
    container_name: remote-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=UTC
    volumes:
      - ./configs/config.example.yaml:/etc/remote-mcp/config.yaml:ro
      - ./configs/known_hosts.example:/etc/remote-mcp/known_hosts:ro
      - ./secrets:/etc/remote-mcp/secrets:ro
      - ./data:/var/lib/remote-mcp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
